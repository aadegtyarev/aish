[package]
name = "aish-llm"
version.workspace = true
edition.workspace = true
description = "OpenAI-compatible streaming clients (chat completions, responses) for aish"
license.workspace = true
authors.workspace = true
publish = false

[features]
# In-process mock HTTP server for tests of this crate and of aish.
mock = []

[dependencies]
serde_json = "1"
# Blocking HTTP on worker threads (no async runtime), rustls for https.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
