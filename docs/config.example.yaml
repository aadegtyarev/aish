providers:
  - id: local
    url: http://localhost:11434/v1
    type: chat                    # chat | responses
    models:
      coder:
        id: qwen2.5-coder:1.5b
      big:
        id: qwen3:32b
        context_window: 32768
        # tools: off              # never offer function tools (agent steps) to this model

  - id: cloud
    url: https://api.openai.com/v1
    type: responses
    key: $OPENAI_API_KEY
    models:
      main:
        id: gpt-6
        effort: medium
        context_window: 400000
        # web: native            # the provider searches the web itself (default for api.openai.com
        #                       # with type: responses; chat providers: set it only if the model does)

# Roles take provider/alias, or just the alias when only one provider has it
# (same for `ai chat <alias>`). Keep aliases short: they are what you type.
roles:
  complete:
    id: local/coder
  chat:
    id: cloud/main
    effort: low

# A role may list several models, tried in order: if the first refuses the
# connection, times out, answers 5xx or 404 before any output, the next one answers
# (a dim `↪ ds · mellum unavailable` line; the failed one is skipped for 60 s).
# `ai model chat ds` saves the choice here and moves it to the front of the list.
# roles:
#   chat: {id: [local/big, cloud/main]}

# Profiles: named sets of roles; `profile:` picks the active one (absent: `roles:`
# above). `ai profile` lists them, `ai profile inet` switches and saves.
# profiles:
#   local: {chat: [big], complete: coder}
#   inet:  {chat: [main, big], complete: coder}
# profile: local

# Name of the in-session control command (status, chat, complete, on/off, config).
# It always wins over any program of that name; `off` disables it (`aish ...` still works).
# command: ai

# Keys. `ask` asks the model from anywhere, also while a command runs (an overlay
# over ssh, REPLs, ...); at the prompt it toggles a `? ` in front of the line.
# `ctrl-<letter>` or `off`; the default is ctrl-q.
# keys:
#   ask: ctrl-q

# Extra read-only command prefixes the agent (`?`) may run by itself, without
# asking. Other commands: see `run:` below.
# allow:
#   - make check
#   - docker ps

# May the model run commands that are not read-only (via the `run` tool)?
#   ask  — (default) a dim prompt under the answer: Enter runs it once, s allows the
#          session, a also writes `run: auto` here, Esc declines. The command is typed
#          into your bash as if you did (visible, sudo can prompt, cd persists); the
#          model gets the exit code, the output tail and the duration.
#   auto — no asking; sudo/su, rm -r/-f, dd, mkfs, fdisk/parted, shutdown/reboot,
#          redirection or tee into files, `curl | sh`, chmod/chown -R, git push --force,
#          git reset --hard and git clean -f still ask.
#   off  — never: the command is put into your input line for Enter.
# Read-only commands keep running by themselves in every mode.
# In a session: `ai run ask|auto|off` (add --save to write it here).
# run: ask
#
#   judge — a model decides instead of you. A plain command (see UX.md) runs unasked;
#           everything else, also long and multi-line commands (up to 16k chars), goes to
#           the judge: ALLOW runs it (`⚖ allowed · reason`), DENY refuses it (the model is
#           told why), ASK or no clear answer within 8 s shows the usual prompt with the
#           reason. Hard-list commands never run on ALLOW. The judge sees only the
#           command, the cwd and your last question, never outputs or history.
# The long form (the scalar `run: judge` keeps working):
# run:
#   mode: judge                 # ask | judge | auto | off
#   judge: local/qwen           # model (or list, tried in order); default: the chat role
#   judge_prompt: {append: "Treat anything under ~/work as low risk."}
#   # judge_prompt: {replace: "~/judge-prompt.txt"}   # a text or a file

# Switch the agent's tools on/off. An off tool is not sent to the model at all.
# `run: off` here removes the run tool entirely (not even read-only commands);
# the `run:` setting above only decides what happens to other commands.
# In a session: `ai tools web off` (add --save to write it here).
# tools:
#   run: on
#   files: on     # read_file
#   web: on       # web_search, web_read (see `web:` below for the backends)
#   skills: on    # reserved

# Web tools for the agent: web_search(query) and web_read(url), read-only, run by themselves.
# Each has a chain of backends, tried in order; one that is unavailable or finds nothing
# is skipped. The query/URL goes through the secret masker and leaves your machine.
# search: provider (the model's own search), duckduckgo (keyless), brave (needs brave_key)
# read:   provider (nothing to do, skipped), direct (our own fetch, public hosts only),
#         jina (r.jina.ai, renders JS pages; works without a key at a low rate)
# web:
#   search: [provider, duckduckgo, brave]   # default [provider, duckduckgo]
#   read: [provider, direct, jina]          # default [provider, direct]
#   brave_key: $BRAVE_API_KEY
#   jina_key: $JINA_API_KEY
# web: off                                  # no web tools at all

# The character that starts a question to the model: one of ? , @ # ; (default ?).
# Quote it. `#` makes `# text` a question (a comment then has no space: `#text`).
# Read at the start of a session.
# prefix: ","

# Conversation memory. When it grows past `at` of the chat model's context window
# (`context_window` on the model; else a local llama.cpp's n_ctx from /props; else 8192),
# the next question first replaces it with a summary of about `size` of the window.
# `?c` compacts at once, `?n` starts a new conversation, `?h` lists the forms.
# compact:
#   model: local/qwen    # default: the chat model in use
#   at: 70%
#   size: 10%
#   prompt: |            # override the default summary prompt
#     Summarise the conversation as terse bullet points ...

# Daily background check for a newer release (one dim line); off disables.
# update_check: off
