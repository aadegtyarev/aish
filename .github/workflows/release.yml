name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
          key: release-${{ hashFiles('Cargo.lock') }}
      # Same image and script as ./pack.sh, so CI and local builds are identical.
      - run: docker build -t aish-pack build
      - run: |
          docker run --rm -v "$PWD":/src -w /src -e CARGO_HOME=/usr/local/cargo \
            -e CARGO_TARGET_DIR=/pack-target -e HOME=/tmp aish-pack \
            ./build/pack-inner.sh x86_64 aarch64
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
