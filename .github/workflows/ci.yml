name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # target dirs (incl. cargo registry and advisory db) are what check.sh mounts into docker.
      - uses: actions/cache@v4
        with:
          path: |
            target
            target-sid
          key: check-${{ hashFiles('Cargo.lock', 'build/Dockerfile*') }}
          restore-keys: check-
      # The same script as local: fmt, clippy, tests on bash 5.2 and 5.3, deny, machete, typos, shellcheck, actionlint.
      - run: ./check.sh
