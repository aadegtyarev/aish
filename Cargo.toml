[workspace]
members = [".", "crates/aish-editor", "crates/aish-llm"]
resolver = "2"

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"
authors = ["Degtyarev Aleksandr <adegtyarev.ap@gmail.com>"]

[package]
name = "aish"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
description = "bash wrapper with LLM assistance"

[dependencies]
anyhow = "1"
tempfile = "3"
# Direct pty via nix instead of portable-pty: we only target unix, need a plain
# master fd for a zero-copy blocking read/write loop, and portable-pty's
# reader/writer wrappers add nothing for that. No tokio either: two blocking
# threads on raw fds have the lowest latency and no runtime to initialise
# (startup time matters); revisit when network/LLM I/O arrives.
nix = { version = "0.29", features = ["term", "ioctl", "fs", "process", "poll", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
signal-hook = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
unicode-width = "0.2"
lineedit-wip = { path = "crates/aish-editor" }
aish-llm = { path = "crates/aish-llm" }
vte = "0.15"
# Web tools (web_read): own fetch with a vetted resolver, no cookies.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
# Release checksums for `aish update`.
sha2 = "0.10"

[dev-dependencies]
expectrl = "0.7"
aish-llm = { path = "crates/aish-llm", features = ["mock"] }

# Static musl builds, see pack.sh. panic stays "unwind": main() relies on catch_unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[package.metadata.deb]
maintainer = "Degtyarev Aleksandr <adegtyarev.ap@gmail.com>"
copyright = "2026, Degtyarev Aleksandr <adegtyarev.ap@gmail.com>"
license-file = ["LICENSE", "0"]
section = "shells"
priority = "optional"
depends = "bash (>= 4.4)"
recommends = "bash-completion"
extended-description = """\
aish runs bash on a pty and adds LLM assistance on top: command blocks with \
status lines, an inline editor, and an `ai` command for chat and agent \
actions with any OpenAI-compatible backend. Without an LLM it behaves like \
plain bash.
Run `aish init` as your own user to set up your shell startup; the package \
never edits user files."""
assets = [
  ["target/release/aish", "usr/bin/aish", "755"],
  ["README.md", "usr/share/doc/aish/README.md", "644"],
  ["docs/UX.md", "usr/share/doc/aish/UX.md", "644"],
  ["docs/config.example.yaml", "usr/share/doc/aish/config.example.yaml", "644"],
]
maintainer-scripts = "debian/"
